name: CD

# One workflow owns main. This prevents duplicate builds when release-please
# merges its PR — both the merge commit and any subsequent tag push are handled
# by this single workflow, ensuring exactly one build per commit.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  release-please:
    name: Release please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  quality:
    name: Quality gate
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-node-ci.yml

  build-push:
    name: Build, scan & push
    needs: [quality, release-please]
    # release-please is skipped on tag pushes and workflow_dispatch
    if: >-
      ${{ !cancelled()
          && needs.quality.result == 'success'
          && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit

  deploy-staging:
    name: Deploy to staging
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying ${{ needs.build-push.outputs.image }} to staging"
          echo "ℹ️  Replace this with your actual deploy command (kubectl, helm, ssh, etc.)"
          # Example:
          # kubectl set image deployment/calc calc=${{ needs.build-push.outputs.image }}

  deploy-production:
    name: Deploy to production
    needs: [build-push, deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify image before production deploy
        run: |
          echo "🔍 Verifying image: ${{ needs.build-push.outputs.image }}"
          # Uncomment when cosign is set up:
          # bash scripts/verify-image.sh "${{ needs.build-push.outputs.image }}"

      - name: Deploy to production
        run: |
          echo "🚀 Deploying ${{ needs.build-push.outputs.image }} to production"
          echo "ℹ️  Replace this with your actual deploy command"
          # Example:
          # kubectl set image deployment/calc calc=${{ needs.build-push.outputs.image }}
